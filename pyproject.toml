[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vastai-mcp"
version = "0.1.0"
description = "MCP server exposing Vast.ai GPU rental, volumes, and billing as tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
http = [
    "uvicorn>=0.30",
    "starlette>=0.38",
]

[project.scripts]
vastai-mcp = "vastai_mcp.server:cli"
vastai-mcp-http = "vastai_mcp.server_http:cli"

[tool.hatch.build.targets.wheel]
packages = ["vastai_mcp"]
